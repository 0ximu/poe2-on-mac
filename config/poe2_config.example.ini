[DISPLAY]
renderer_type=DirectX12
fullscreen=false
vsync=Adaptive
framerate_limit=60
framerate_limit_enabled=true
background_framerate_limit=30
shadow_type=Low
texture_quality=TextureQualityMedium
use_dynamic_resolution=true
water_detail=0
bloom_strength=0.25

; --- Notes (do NOT paste comment lines into your real config) ---
;
; This is a reference for a stable Apple Silicon setup, not a drop-in file.
; Your real config lives at:
;   ~/Documents/My Games/Path of Exile 2/poe2_production_Config.ini
;
; * renderer_type=DirectX12 is mandatory on Mac. Vulkan crashes on startup.
; * Set resolution_width/height to your display's native resolution.
; * framerate_limit: match your display's refresh rate (usually 60).
; * engine_multithreading_mode: do NOT set this here; the game ignores
;   file edits for it. Disable it in game (Options > Graphics) if you
;   get freezes.
; * Prefer changing everything through the in-game menu. The game
;   rewrites this file on exit and silently drops values it dislikes.
